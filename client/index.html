<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Evanysca à Port-Gentil : boubous, ensembles, parfums et décoration. Commande simplement par WhatsApp." />
    <title>Evanysca</title>
    <!-- SVG pour les navigateurs récents, PNG en repli : Safari ignore encore souvent l'icône SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2B2622" />
    <!-- Aperçu affiché par WhatsApp quand un message contient le lien du site. WhatsApp exige une
         adresse absolue pour l'image : à changer si le site passe sur un autre nom de domaine. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Evanysca" />
    <meta property="og:title" content="Evanysca — Mode, parfums et maison" />
    <meta property="og:description" content="Boutique à Port-Gentil. Commande simplement par WhatsApp." />
    <meta property="og:url" content="https://evanysca-sigma.vercel.app" />
    <meta property="og:image" content="https://evanysca-sigma.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&family=Jost:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
